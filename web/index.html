<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="google-signin-client_id" content="TU_CLIENT_ID.apps.googleusercontent.com" />
>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="myapp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>myapp</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps API (beta para AutocompleteSuggestion) -->
  <!-- Load maps async+defer to avoid blocking and follow recommended loader patterns. -->
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBtEYqVfNtm14WstANwadcr7SRLyhc_wCk&libraries=places&v=beta"></script>
  
  
  <!-- Pin Firebase JS SDK to 12.2.0 to avoid known regression in 12.3.0
    (the app previously loaded 12.3.0 which triggered onSnapshot errors
    in some cloud_firestore_web interop code). Loading these scripts
    explicitly ensures the web runtime uses this stable version.) -->
  <!-- Use the compat builds so they can be loaded as non-module scripts and
    expose the expected global compat APIs used by FlutterFire web interop.
    This avoids errors like "Unexpected token 'export'" or
    "Cannot use import statement outside a module" when the SDK is
    distributed as ESM. If you migrate your web interop to ES modules,
    prefer loading the module variants with type="module" instead. -->
  <script src="https://www.gstatic.com/firebasejs/12.2.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.2.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.2.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.2.0/firebase-messaging-compat.js"></script>

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #FFFFFF;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <!-- Suppress noisy Dev error overlays for known benign Firestore permission errors
       by preventing the default handling of window error/rejection events when
       they match known patterns. This keeps the UI usable for end-users while
       still logging suppressed errors to console as warnings. -->
  <script>
    try {
      window.addEventListener('error', function (e) {
        try {
          var msg = (e && e.message) ? String(e.message).toLowerCase() : '';
          if (msg.indexOf('cloud_firestore') !== -1 || msg.indexOf('permission-denied') !== -1 || msg.indexOf('permission denied') !== -1) {
            console.warn('Suppressed error event (firestore/permission):', e.message);
            e.preventDefault();
            return true;
          }
        } catch (err) {
          // swallow
        }
      }, {capture: false, passive: false});

      window.addEventListener('unhandledrejection', function (e) {
        try {
          var reason = '';
          if (e && e.reason) {
            reason = (e.reason.message || e.reason.toString || String(e.reason)).toLowerCase();
          }
          if (reason.indexOf('cloud_firestore') !== -1 || reason.indexOf('permission-denied') !== -1 || reason.indexOf('permission denied') !== -1) {
            console.warn('Suppressed unhandledrejection (firestore/permission):', e.reason);
            e.preventDefault();
            return true;
          }
        } catch (err) {
          // swallow
        }
      }, {capture: false, passive: false});
    } catch (e) {
      // if any environment doesn't support these APIs just ignore
    }
  </script>
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  
  
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
