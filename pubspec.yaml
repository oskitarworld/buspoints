name: myapp
description: A new Flutter project.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.0.5

  # Biometric Authentication
  local_auth: ^3.0.0

  # Notificaciones Push
  firebase_messaging: ^16.1.0

  # Google Services
  google_sign_in: ^6.2.1
  google_maps_flutter: ^2.6.0

  # Location
  geolocator: ^14.0.2
  permission_handler: ^12.0.1

  # UI & Utilities
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  provider: ^6.1.2
  flutter_rating_bar: ^4.0.1
  rxdart: ^0.28.0
  firebase_messaging_web: ^4.1.1
  js: ^0.7.2
  url_launcher: ^6.2.6
  xml: ^6.5.0
  slide_to_act: ^2.0.2
  geoflutterfire_plus: ^0.0.7
  http: ^1.2.1
  share_plus: ^12.0.1
  shared_preferences: ^2.2.0
  cloud_functions: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  path: ^1.8.0

dependency_overrides:
  google_sign_in: ^6.2.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_escritorio2.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_escritorio2.png"
  remove_alpha_ios: true
